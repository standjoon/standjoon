<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		
		<!-- 💡 이미지가 뜨지 않고 텍스트형으로만 나오도록 og:image 태그를 완전히 제거했습니다 -->
		<meta property="og:title" content="standjoon" />
		<meta property="og:description" content="archive studio" />

		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 상단 메뉴 글자색 고정 */
			#nav > ul > li > a {
				color: #333333 !important;
				background: transparent !important;
			}

			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;        
				box-shadow: none !important;       
			}

			/* 중앙 이미지 및 텍스트 정렬 (PC 기준) */
			.center-image-container {
				display: flex;
				flex-direction: column; 
				justify-content: center;
				align-items: center;
				min-height: 50vh;
				width: 100%;
				padding: 0 20px;
				box-sizing: border-box;
				text-align: center;
				margin-top: 250px;
			}

			/* 기본 이미지 박스 */
			.hover-image-box {
				position: relative;
				width: 100%;
				max-width: 220px; 
				cursor: pointer;
				margin-bottom: 20px; 
			}
			.hover-image-box .img-default {
				display: block;
				width: 100%;
				height: auto;
				transition: opacity 0.3s ease;
			}
			.hover-image-box .img-hover {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: auto;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.hover-image-box:hover .img-default {
				opacity: 0;
			}
			.hover-image-box:hover .img-hover {
				opacity: 1;
			}

			.welcome-text {
				font-family: 'Oswald', sans-serif;
				font-size: 1rem;
				letter-spacing: 2px; 
				color: #666666;
				text-transform: uppercase;
				margin: 0 0 25px 0;
			}

			.intro-text {
				font-family: 'Oswald', 'NanumHuman', sans-serif;
				font-size: 0.85rem;
				letter-spacing: 1.5px;
				color: #888888;
				text-transform: lowercase;
				margin: 0;
			}

			/* 템플릿 기본 사이드바 숨김 */
			#navPanel, #titleBar {
				display: none !important;
			}

			/* 모바일 전용 커스텀 햄버거 버튼 (레고 PNG 아이콘) */
			.custom-mobile-btn {
				display: none;
				position: fixed;
				top: 15px;
				left: 15px;
				width: 44px;
				height: 44px;
				background-image: url('images/red.png');
				background-size: contain;
				background-repeat: no-repeat;
				background-position: center;
				background-color: transparent;
				border: none;
				cursor: pointer;
				z-index: 10005;
				text-indent: -9999px;
			}

			/* 모바일 풀스크린 오버레이 메뉴 기본 상태 (숨김) */
			.mobile-overlay {
				display: none; 
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				background-color: rgba(255, 255, 255, 0.85);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				z-index: 99999;
				justify-content: center;
				align-items: center;
			}

			/* 자바스크립트로 제어할 클래스 */
			.mobile-overlay.is-visible {
				display: flex !important;
			}

			.mobile-menu-list {
				list-style: none;
				padding: 0;
				margin: 0;
				text-align: center;
			}

			.mobile-menu-list li {
				margin: 22px 0;
			}

			.mobile-menu-list li a {
				font-family: 'Oswald', sans-serif;
				font-size: 1.05rem;
				font-weight: 300;
				letter-spacing: 2.5px;
				color: #222222;
				text-transform: uppercase;
				text-decoration: none;
				background: transparent;
				box-shadow: none;
				transition: opacity 0.2s ease;
			}

			.mobile-menu-list li a:hover {
				opacity: 0.4;
				background: transparent;
			}

			.mobile-close-btn {
				position: absolute;
				top: 20px;
				right: 25px;
				font-size: 32px;
				font-weight: 300;
				background: none;
				border: none;
				cursor: pointer;
				color: #333;
				z-index: 100000;
				padding: 0;
				line-height: 1;
			}

			/* 📱 모바일 화면(폭 736px 이하) 레이아웃 전환 및 정중앙 배치 설정 */
			@media screen and (max-width: 736px) {
				#header {
					display: none !important;
				}
				.custom-mobile-btn {
					display: block !important;
				}
				.center-image-container {
					margin-top: 0px !important; 
					min-height: 100vh !important; /* 💡 화면 전체 높이 사용 */
					justify-content: center !important; /* 💡 수직 정중앙 정렬 */
				}
				.hover-image-box {
					max-width: 150px !important;
				}
				.welcome-text {
					font-size: 0.85rem !important;
					margin-bottom: 20px !important;
				}
				.intro-text {
					font-size: 0.75rem !important;
				}
			}
		</style>
	</head>
	<body class="is-preload">
		<!-- 모바일 전용 커스텀 햄버거 버튼 -->
		<button id="customMenuBtn" class="custom-mobile-btn" type="button">Menu</button>

		<div id="page-wrapper">
			
			<!-- Header (PC용) -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li class="current"><a href="index.html">Home</a></li>
						<li><a href="profile.html">Profile</a></li>
						<li><a href="Architecture.html">Architecture</a></li>
						<li><a href="Artwork.html">Artwork</a></li>
					</ul>
				</nav>
			</section>

			<!-- 중앙 이미지 및 텍스트 영역 -->
			<div class="center-image-container">
				<div class="hover-image-box">
					<img src="images/lego.jpg" alt="Lego" class="img-default" />
					<img src="images/legochange.jpg" alt="Lego Change" class="img-hover" />
				</div>
				<p class="welcome-text">Welcome</p>
				<p class="intro-text">standjoon archive studio</p>
			</div>

		</div>

		<!-- 모바일 풀스크린 오버레이 메뉴 구조 -->
		<div id="mobileMenuOverlay" class="mobile-overlay">
			<button id="mobileCloseBtn" class="mobile-close-btn" type="button">&times;</button>
			<ul class="mobile-menu-list">
				<li><a href="index.html">Home</a></li>
				<li><a href="profile.html">Profile</a></li>
				<li><a href="Architecture.html">Architecture</a></li>
				<li><a href="Artwork.html">Artwork</a></li>
			</ul>
		</div>

		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min
