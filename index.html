<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 💡 상단 메뉴 글자색을 명확한 어두운 색상으로 강제 고정 */
			#nav > ul > li > a {
				color: #333333 !important;
				background: transparent !important;
			}

			/* 메뉴 선택되거나 마우스 올렸을 때도 깔끔하게 유지 */
			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;         
				box-shadow: none !important;        
			}

			/* 중앙 이미지 및 텍스트 정렬 (PC 기준 250px 아래로 내림) */
			.center-image-container {
				display: flex;
				flex-direction: column; 
				justify-content: center;
				align-items: center;
				min-height: 50vh;
				width: 100%;
				padding: 0 20px;
				box-sizing: border-box;
				text-align: center;
				margin-top: 250px; /* 💡 PC에서 아래로 250px 밀어냄 */
			}

			/* 기본 이미지 박스 (PC 기준) */
			.hover-image-box {
				position: relative;
				width: 100%;
				max-width: 220px; 
				cursor: pointer;
				margin-bottom: 20px; 
			}
			.hover-image-box .img-default {
				display: block;
				width: 100%;
				height: auto;
				transition: opacity 0.3s ease;
			}
			.hover-image-box .img-hover {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: auto;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.hover-image-box:hover .img-default {
				opacity: 0;
			}
			.hover-image-box:hover .img-hover {
				opacity: 1;
			}

			/* Welcome 텍스트 스타일 (WELCOME은 대문자 유지) */
			.welcome-text {
				font-family: 'Oswald', sans-serif;
				font-size: 1rem;
				letter-spacing: 2px; 
				color: #666666;
				text-transform: uppercase;
				margin: 0 0 25px 0;
			}

			/* 🎨 standjoon archive studio 텍스트 스타일 (소문자 적용) */
			.intro-text {
				font-family: 'Oswald', 'NanumHuman', sans-serif;
				font-size: 0.85rem;
				letter-spacing: 1.5px;
				color: #888888;
				text-transform: lowercase; /* 전부 소문자로 강제 변환 */
				margin: 0;
			}

			/* 📱 모바일 상단 햄버거 메뉴 버튼을 커스텀 이미지로 변경 */
			#titleBar .toggle {
				background-image: url('images/red.png') !important; /* 👈 'images/원하는이미지이름.png' 경로로 변경하세요 */
				background-size: 40% auto !important;
				background-repeat: no-repeat !important;
				background-position: center !important;
				background-color: transparent !important; /* 회색 박스 배경을 없애려면 transparent */
				text-indent: -9999px !important;
			}

			/* 📱 모바일 메뉴(사이드 패널) 디자인 개선 */
			#navPanel {
				background-color: #ffffff !important;
				box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05) !important;
				padding: 30px 20px !important;
			}

			#navPanel a {
				font-family: 'Oswald', 'NanumHuman', sans-serif !important;
				font-size: 1.1rem !important;
				letter-spacing: 1.5px !important;
				color: #444444 !important;
				text-transform: uppercase !important;
				padding: 12px 10px !important;
				border-bottom: 1px solid #f0f0f0 !important;
				display: block !important;
				transition: color 0.2s ease !important;
			}

			#navPanel a:hover {
				color: #111111 !important;
				background: transparent !important;
			}

			/* 📱 모바일 화면(폭 736px 이하)에서 크기 조절 (모바일은 margin-top을 초기화해서 영향 안 받게 함) */
			@media screen and (max-width: 736px) {
				.center-image-container {
					margin-top: 0px !important; /* 모바일은 원래대로 유지 */
					min-height: 60vh;
				}
				.hover-image-box {
					max-width: 150px !important;
				}
				.welcome-text {
					font-size: 0.85rem !important;
					margin-bottom: 20px !important;
				}
				.intro-text {
					font-size: 0.75rem !important;
				}
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="page-wrapper">
			
			<!-- Header: 대문자 파일명 링크로 수정 완료 -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li class="current"><a href="index.html">Home</a></li>
						<li><a href="profile.html">Profile</a></li>
						<li><a href="Architecture.html">Architecture</a></li>
						<li><a href="Artwork.html">Artwork</a></li>
					</ul>
				</nav>
			</section>

			<!-- 중앙 이미지 및 텍스트 영역 -->
			<div class="center-image-container">
				<div class="hover-image-box">
					<img src="images/lego.jpg" alt="Lego" class="img-default" />
					<img src="images/legochange.jpg" alt="Lego Change" class="img-hover" />
				</div>
				<p class="welcome-text">Welcome</p>
				<p class="intro-text">standjoon archive studio</p>
			</div>

		</div>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
