<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 상단 메뉴 글자색 고정 */
			#nav > ul > li > a {
				color: #333333 !important;
				background: transparent !important;
			}

			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;         
				box-shadow: none !important;        
			}

			/* 중앙 이미지 및 텍스트 정렬 */
			.center-image-container {
				display: flex;
				flex-direction: column; 
				justify-content: center;
				align-items: center;
				min-height: 50vh;
				width: 100%;
				padding: 0 20px;
				box-sizing: border-box;
				text-align: center;
				margin-top: 250px;
			}

			/* 기본 이미지 박스 */
			.hover-image-box {
				position: relative;
				width: 100%;
				max-width: 220px; 
				cursor: pointer;
				margin-bottom: 20px; 
			}
			.hover-image-box .img-default {
				display: block;
				width: 100%;
				height: auto;
				transition: opacity 0.3s ease;
			}
			.hover-image-box .img-hover {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: auto;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.hover-image-box:hover .img-default {
				opacity: 0;
			}
			.hover-image-box:hover .img-hover {
				opacity: 1;
			}

			.welcome-text {
				font-family: 'Oswald', sans-serif;
				font-size: 1rem;
				letter-spacing: 2px; 
				color: #666666;
				text-transform: uppercase;
				margin: 0 0 25px 0;
			}

			.intro-text {
				font-family: 'Oswald', 'NanumHuman', sans-serif;
				font-size: 0.85rem;
				letter-spacing: 1.5px;
				color: #888888;
				text-transform: lowercase;
				margin: 0;
			}

			/* 템플릿의 기존 구형 사이드바 패널과 기본 버튼 숨김 */
			#navPanel, #titleBar {
				display: none !important;
			}

			/* 모바일 전용 커스텀 햄버거 버튼 (레고 PNG 아이콘) */
			.custom-mobile-btn {
				display: none;
				position: fixed;
				top: 15px;
				left: 15px;
				width: 44px;
				height: 44px;
				background-image: url('images/red.png');
				background-size: contain;
				background-repeat: no-repeat;
				background-position: center;
				background-color: transparent;
				border: none;
				cursor: pointer;
				z-index: 10005;
				text-indent: -9999px;
			}

			/* 풀스크린 오버레이 메뉴 스타일 (흰색 반투명 + 흐림 효과 + 중앙 정렬) */
			.mobile-overlay {
				display: none; 
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(255, 255, 255, 0.92); /* 흰색 반투명 배경 */
				backdrop-filter: blur(12px); /* 뿌연 유리 질감 */
				-webkit-backdrop-filter: blur(12px);
				z-index: 10000;
				justify-content: center;
				align-items: center;
			}

			.mobile-overlay.active {
				display: flex !important; 
			}

			.mobile-menu-list {
				list-style: none;
				padding: 0;
				margin: 0;
				text-align: center;
			}

			.mobile-menu-list li {
				margin: 30px 0;
			}

			.mobile-menu-list li a {
				font-family: 'Oswald', 'NanumHuman', sans-serif !important;
				font-size: 1.5rem !important;
				font-weight: 500;
				letter-spacing: 2px;
				color: #111111 !important;
				text-transform: uppercase;
				text-decoration: none;
				transition: opacity 0.2s ease;
			}

			.mobile-menu-list li a:hover {
				opacity: 0.5;
				background: transparent !important;
			}

			/* 우측 상단 닫기(X) 버튼 */
			.mobile-close-btn {
				position: absolute;
				top: 25px;
				right: 25px;
				font-size: 40px;
				background: none;
				border: none;
				cursor: pointer;
				color: #111;
				z-index: 10006;
			}

			/* 모바일 화면(폭 736px 이하) 레이아웃 전환 */
			@media screen and (max-width: 736px) {
				#header {
					display: none !important;
				}
				.custom-mobile-btn {
					display: block !important;
				}
				.center-image-container {
					margin-top: 0px !important; 
					min-height: 60vh;
				}
				.hover-image-box {
					max-width: 150px !important;
				}
				.welcome-text {
					font-size: 0.85rem !important;
					margin-bottom: 20px !important;
				}
				.intro-text {
					font-size: 0.75rem !important;
				}
			}
		</style>
	</head>
	<body class="is-preload">
		<!-- 모바일 전용 커스텀 햄버거 버튼 -->
		<button id="customMenuBtn" class="custom-mobile-btn">Menu</button>

		<div id="page-wrapper">
			
			<!-- Header (PC용) -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li class="current"><a href="index.html">Home</a></li>
						<li><a href="profile.html">Profile</a></li>
						<li><a href="Architecture.html">Architecture</a></li>
						<li><a href="Artwork.html">Artwork</a></li>
					</ul>
				</nav>
			</section>

			<!-- 중앙 이미지 및 텍스트 영역 -->
			<div class="center-image-container">
				<div class="hover-image-box">
					<img src="images/lego.jpg" alt="Lego" class="img-default" />
					<img src="images/legochange.jpg" alt="Lego Change" class="img-hover" />
				</div>
				<p class="welcome-text">Welcome</p>
				<p class="intro-text">standjoon archive studio</p>
			</div>

		</div>

		<!-- 모바일 풀스크린 오버레이 메뉴 구조 -->
		<div id="mobileMenuOverlay" class="mobile-overlay">
			<button id="mobileCloseBtn" class="mobile-close-btn">&times;</button>
			<ul class="mobile-menu-list">
				<li><a href="index.html">Home</a></li>
				<li><a href="profile.html">Profile</a></li>
				<li><a href="Architecture.html">Architecture</a></li>
				<li><a href="Artwork.html">Artwork</a></li>
			</ul>
		</div>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

		<!-- 모바일 오버레이 메뉴 제어 스크립트 -->
		<script>
			window.addEventListener("DOMContentLoaded", function() {
				const customMenuBtn = document.getElementById('customMenuBtn');
				const overlay = document.getElementById('mobileMenuOverlay');
				const closeBtn = document.getElementById('mobileCloseBtn');
				const menuLinks = document.querySelectorAll('.mobile-menu-list a');

				if (customMenuBtn && overlay) {
					customMenuBtn.addEventListener('click', function(e) {
						e.preventDefault();
						e.stopPropagation();
						overlay.classList.add('active');
					});
				}

				if (closeBtn && overlay) {
					closeBtn.addEventListener('click', function(e) {
						e.preventDefault();
						overlay.classList.remove('active');
					});
				}

				menuLinks.forEach(link => {
					link.addEventListener('click', function() {
						overlay.classList.remove('active');
					});
				});
			});
		</script>
	</body>
</html>
