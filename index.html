<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 💡 상단 메뉴 글자색을 명확한 어두운 색상으로 강제 고정 */
			#nav > ul > li > a {
				color: #333333 !important;
				background: transparent !important;
			}

			/* 메뉴 선택되거나 마우스 올렸을 때도 깔끔하게 유지 */
			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;         
				box-shadow: none !important;        
			}

			/* 중앙 이미지 및 텍스트 정렬 (PC 기준 250px 아래로 내림) */
			.center-image-container {
				display: flex;
				flex-direction: column; 
				justify-content: center;
				align-items: center;
				min-height: 50vh;
				width: 100%;
				padding: 0 20px;
				box-sizing: border-box;
				text-align: center;
				margin-top: 250px; /* 💡 PC에서 아래로 250px 밀어냄 */
			}

			/* 기본 이미지 박스 (PC 기준) */
			.hover-image-box {
				position: relative;
				width: 100%;
				max-width: 220px; 
				cursor: pointer;
				margin-bottom: 20px; 
			}
			.hover-image-box .img-default {
				display: block;
				width: 100%;
				height: auto;
				transition: opacity 0.3s ease;
			}
			.hover-image-box .img-hover {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: auto;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.hover-image-box:hover .img-default {
				opacity: 0;
			}
			.hover-image-box:hover .img-hover {
				opacity: 1;
			}

			/* Welcome 텍스트 스타일 (WELCOME은 대문자 유지) */
			.welcome-text {
				font-family: 'Oswald', sans-serif;
				font-size: 1rem;
				letter-spacing: 2px; 
				color: #666666;
				text-transform: uppercase;
				margin: 0 0 25px 0;
			}

			/* 🎨 standjoon archive studio 텍스트 스타일 (소문자 적용) */
			.intro-text {
				font-family: 'Oswald', 'NanumHuman', sans-serif;
				font-size: 0.85rem;
				letter-spacing: 1.5px;
				color: #888888;
				text-transform: lowercase; /* 전부 소문자로 강제 변환 */
				margin: 0;
			}

			/* 📱 모바일 아이콘(토글 버튼) 디자인 설정 */
			#titleBar .toggle,
			#titleBar .toggle::before,
			#titleBar .toggle::after {
				background: none !important;
				background-color: transparent !important;
				box-shadow: none !important;
				border: none !important;
			}

			#titleBar .toggle {
				background-image: url('images/red.png') !important; /* 본인 PNG 파일명 확인 */
				background-size: contain !important;
				background-repeat: no-repeat !important;
				background-position: center !important;
				width: 44px !important;
				height: 44px !important;
				padding: 0 !important;
				text-indent: -9999px !important;
				position: absolute !important;
				top: 12px !important;
				left: 12px !important;
				z-index: 10001; /* 오버레이보다 위쪽에 보이도록 설정 */
			}

			/* 📱 모바일 전용 풀스크린 오버레이 메뉴 스타일 (요청하신 흰색 반투명 + 중앙 정렬 + 즉시 등장) */
			.mobile-overlay {
				display: none; 
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(255, 255, 255, 0.90); /* 흰색 반투명 배경 */
				backdrop-filter: blur(12px); /* 뿌연 유리 질감 효과 */
				-webkit-backdrop-filter: blur(12px);
				z-index: 10000; /* 컨텐츠 상단에 위치 */
				justify-content: center;
				align-items: center;
			}

			/* 자바스크립트로 active 클래스가 붙으면 화면에 바로 나타남 */
			.mobile-overlay.active {
				display: flex; 
			}

			/* 메뉴 리스트 중앙 정렬 및 간격 */
			.mobile-menu-list {
				list-style: none;
				padding: 0;
				margin: 0;
				text-align: center;
			}

			.mobile-menu-list li {
				margin: 28px 0;
			}

			.mobile-menu-list li a {
				font-family: 'Oswald', 'NanumHuman', sans-serif !important;
				font-size: 1.4rem !important;
				font-weight: 500;
				letter-spacing: 2px;
				color: #222222 !important;
				text-transform: uppercase;
				text-decoration: none;
				transition: opacity 0.2s ease;
			}

			.mobile-menu-list li a:hover {
				opacity: 0.5;
				background: transparent !important;
			}

			/* 우측 상단 닫기(X) 버튼 스타일 */
			.mobile-close-btn {
				position: absolute;
				top: 25px;
				right: 25px;
				font-size: 38px;
				background: none;
				border: none;
				cursor: pointer;
				color: #222;
				z-index: 10002;
			}

			/* 📱 모바일 화면(폭 736px 이하) 크기 조절 */
			@media screen and (max-width: 736px) {
				.center-image-container {
					margin-top: 0px !important; 
					min-height: 60vh;
				}
				.hover-image-box {
					max-width: 150px !important;
				}
				.welcome-text {
					font-size: 0.85rem !important;
					margin-bottom: 20px !important;
				}
				.intro-text {
					font-size: 0.75rem !important;
				}
			}
		</style>
	</head>
