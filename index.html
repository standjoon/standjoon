<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 메뉴 선택된 곳의 빨간색 배경 제거 및 깔끔한 텍스트화 */
			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;          
				box-shadow: none !important;        
			}
			
			#nav > ul > li > a {
				color: #555555 !important;
				background: transparent !important;
			}

			/* 중앙 이미지 및 텍스트 정렬 */
			.center-image-container {
				display: flex;
				flex-direction: column; 
				justify-content: center;
				align-items: center;
				min-height: 65vh;
				width: 100%;
				padding: 0 20px;
				box-sizing: border-box;
			}

			/* 🎨 모바일 크기 최적화된 이미지 박스 */
			.hover-image-box {
				position: relative;
				width: 100%;
				max-width: 220px; /* PC에서는 최대 220px로 아담하게, 모바일에서는 화면에 맞춰 축소됨 */
				cursor: pointer;
				margin-bottom: 20px; 
			}
			.hover-image-box .img-default {
				display: block;
				width: 100%;
				height: auto;
				transition: opacity 0.3s ease;
			}
			.hover-image-box .img-hover {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: auto;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.hover-image-box:hover .img-default {
				opacity: 0;
			}
			.hover-image-box:hover .img-hover {
				opacity: 1;
			}

			/* Welcome 텍스트 스타일 */
			.welcome-text {
				font-family: 'Oswald', sans-serif;
				font-size: 1rem;
				letter-spacing: 2px; 
				color: #666666;
				text-transform: uppercase;
				margin: 0;
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="page-wrapper">
			
			<!-- Header -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li class="current"><a href="index.html">Home</a></li>
						<li><a href="left-sidebar.html">Profile</a></li>
					</ul>
				</nav>
			</section>

			<!-- 중앙 이미지 및 텍스트 영역 -->
			<div class="center-image-container">
				<div class="hover-image-box">
					<img src="images/lego.png" alt="Lego" class="img-default" />
					<img src="images/legochange.png" alt="Lego Change" class="img-hover" />
				</div>
				<p class="welcome-text">Welcome</p>
			</div>

		</div>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
