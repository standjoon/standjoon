<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 상단 메뉴 글자색 고정 */
			#nav > ul > li > a {
				color: #333333 !important;
				background: transparent !important;
			}

			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;         
				box-shadow: none !important;        
			}

			/* 중앙 이미지 및 텍스트 정렬 */
			.center-image-container {
				display: flex;
				flex-direction: column; 
				justify-content: center;
				align-items: center;
				min-height: 50vh;
				width: 100%;
				padding: 0 20px;
				box-sizing: border-box;
				text-align: center;
				margin-top: 250px;
			}

			/* 기본 이미지 박스 */
			.hover-image-box {
				position: relative;
				width: 100%;
				max-width: 220px; 
				cursor: pointer;
				margin-bottom: 20px; 
			}
			.hover-image-box .img-default {
				display: block;
				width: 100%;
				height: auto;
				transition: opacity 0.3s ease;
			}
			.hover-image-box .img-hover {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: auto;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.hover-image-box:hover .img-default {
				opacity: 0;
			}
			.hover-image-box:hover .img-hover {
				opacity: 1;
			}

			.welcome-text {
				font-family: 'Oswald', sans-serif;
				font-size: 1rem;
				letter-spacing: 2px; 
				color: #666666;
