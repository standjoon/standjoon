<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 제목이 사라진 만큼 상단 여백을 살짝 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 중앙 이미지 박스 */
			.center-image-container {
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 70vh;
				width: 100%;
			}

			/* 이미지 마우스 오버 효과 */
			.hover-image-box {
				position: relative;
				width: 300px; /* 이미지 크기 조절 */
				cursor: pointer;
			}
			.hover-image-box .img-default {
				display: block;
				width: 100%;
				height: auto;
				transition: opacity 0.3s ease;
			}
			.hover-image-box .img-hover {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: auto;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.hover-image-box:hover .img-default {
				opacity: 0;
			}
			.hover-image-box:hover .img-hover {
				opacity: 1;
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="page-wrapper">
			
			<!-- Header: 제목 삭제하고 메뉴만 남김 -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li class="current"><a href="index.html">Home</a></li>
						<li><a href="left-sidebar.html">Profile</a></li>
					</ul>
				</nav>
			</section>

			<!-- 중앙 이미지 영역 -->
			<div class="center-image-container">
				<div class="hover-image-box">
					<!-- 본인의 이미지 파일 경로로 수정하세요 -->
					<img src="images/lego-sunbi.jpg" alt="Lego Sunbi" class="img-default" />
					<img src="images/lego-change.jpg" alt="Lego Change" class="img-hover" />
				</div>
			</div>

		</div>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
