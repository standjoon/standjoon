<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon - architecture</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 메뉴 선택된 곳의 빨간색 배경 제거 및 깔끔한 텍스트화 */
			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;          
				box-shadow: none !important;        
			}
			
			#nav > ul > li > a {
				color: #555555 !important;
				background: transparent !important;
			}

			/* 본문 영역 컨테이너 */
			.page-container {
				max-width: 1100px;
				margin: 0 auto;
				padding: 40px 20px 80px 20px;
				box-sizing: border-box;
			}

			/* 페이지 타이틀 스타일 */
			.page-title {
				font-family: 'Oswald', sans-serif;
				font-size: 1.8rem;
				letter-spacing: 2px;
				color: #111111;
				text-transform: uppercase;
				margin-bottom: 40px;
				text-align: left;
			}

			/* 3열 그리드 레이아웃 설정 */
			.gallery-grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 30px;
			}

			/* 🎨 개별 작품 카드 스타일 (1:1 정사각형 틀 고정) */
			.gallery-item {
				position: relative;
				display: block;
				text-decoration: none;
				background: #ffffff;
				overflow: hidden;
				aspect-ratio: 1 / 1;
			}

			/* 💡 이미지 박스 (여백을 주어 이미지가 아담하게 보이도록 조절) */
			.gallery-img-box {
				width: 100%;
				height: 100%;
				background-color: #ffffff;
				display: flex;
				justify-content: center;
				align-items: center;
				padding: 25px;
				box-sizing: border-box;
			}

			.gallery-img-box img {
				max-width: 100%;
				max-height: 100%;
				width: auto;
				height: auto;
				object-fit: contain;
				display: block;
			}

			/* 💡 마우스 올리기 전엔 투명해서 안 보이는 '반투명 막 + 글자' 박스 */
			.overlay-text-box {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(255, 255, 255, 0.85); /* 마우스 올렸을 때 씌워질 흰색 반투명 막 */
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				opacity: 0; /* 평소엔 숨김 */
				transition: opacity 0.3s ease; /* 부드럽게 나타나는 효과 */
				text-align: center;
				padding: 20px;
				box-sizing: border-box;
			}

			/* 💡 마우스를 올렸을 때(.gallery-item에 hover하면) 박스가 뿅 하고 나타남 */
			.gallery-item:hover .overlay-text-box {
				opacity: 1;
			}

			/* 오버레이 안의 작품 제목 */
			.overlay-text-box .project-title {
				font-family: 'Oswald', sans-serif;
				font-size: 1.1rem;
				letter-spacing: 1px;
				color: #111111;
				margin: 0 0 5px 0;
				text-transform: uppercase;
			}

			/* 오버레이 안의 간단 설명/연도 */
			.overlay-text-box .project-desc {
				font-family: 'NanumHuman', sans-serif;
				font-size: 0.85rem;
				color: #555555;
				margin: 0;
			}

			/* 📱 모바일 화면 대응 */
			@media screen and (max-width: 736px) {
				.page-container {
					padding: 20px 15px 50px 15px;
				}
				.page-title {
					font-size: 1.3rem;
					margin-bottom: 20px;
					padding-left: 10px;
				}
				.gallery-grid {
					grid-template-columns: repeat(1, 1fr);
					gap: 30px;
				}
				.gallery-item {
					max-width: 55%;
					margin: 0 auto;
					width: 100%;
				}
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="page-wrapper">
			
			<!-- Header -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="profile.html">Profile</a></li>
						<li class="current"><a href="Architecture.html">Architecture</a></li>
						<li><a href="Artwork.html">Artwork</a></li>
					</ul>
				</nav>
			</section>

			<!-- 건축 아카이브 갤러리 영역 -->
			<div class="page-container">
				<h2 class="page-title">Architecture</h2>
				<div class="gallery-grid" id="gallery-container">
					<!-- 자바스크립트에 의해 카드가 자동으로 생성됩니다. -->
				</div>
			</div>

		</div>

		<!-- 🪄 자바스크립트 자동 생성 및 정렬 시스템 -->
		<script>
			const projects = [
				{ id: 3, title: "nontitle", desc: "2023", img: "images/lego.png" },
				{ id: 2, title: "UAM Masterplan", desc: "2024", img: "images/uam sum.jpg" }, // 👈 썸네일 전용 이미지 적용 완료!
				{ id: 1, title: "thisconnect museum", desc: "2022", img: "images/2-2 perspective.jpg" }
			];

			const container = document.getElementById('gallery-container');

			projects.forEach(project => {
				const item = document.createElement('a');
				item.href = `detail.html?id=${project.id}`;
				item.className = 'gallery-item';
				
				item.innerHTML = `
					<div class="gallery-img-box">
						<img src="${project.img}" alt="${project.title}" />
					</div>
					<div class="overlay-text-box">
						<h3 class="project-title">${project.title}</h3>
						<p class="project-desc">${project.desc}</p>
					</div>
				`;
				
				container.appendChild(item);
			});
		</script>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
