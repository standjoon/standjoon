<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon - artwork</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 메뉴 선택된 곳의 빨간색 배경 제거 및 깔끔한 텍스트화 */
			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;          
				box-shadow: none !important;        
			}
			
			#nav > ul > li > a {
				color: #555555 !important;
				background: transparent !important;
			}

			/* 본문 영역 컨테이너 */
			.page-container {
				max-width: 1100px;
				margin: 0 auto;
				padding: 40px 20px 80px 20px;
				box-sizing: border-box;
			}

			/* 페이지 타이틀 스타일 */
			.page-title {
				font-family: 'Oswald', sans-serif;
				font-size: 1.8rem;
				letter-spacing: 2px;
				color: #111111;
				text-transform: uppercase;
				margin-bottom: 40px;
				text-align: left;
			}

			/* 3열 그리드 레이아웃 설정 */
			.gallery-grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 30px;
			}

			/* 개별 작품 카드 스타일 */
			.gallery-item {
				position: relative;
				display: block;
				text-decoration: none;
				background: #ffffff;
				overflow: hidden;
				aspect-ratio: 4 / 3;
			}

			.gallery-img-box {
				width: 100%;
				height: 100%;
			}

			.gallery-img-box img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}

			/* 마우스 올렸을 때 나타날 반투명 막 + 글자 박스 */
			.overlay-text-box {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(255, 255, 255, 0.85);
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				opacity: 0;
				transition: opacity 0.3s ease;
				text-align: center;
				padding: 20px;
				box-sizing: border-box;
			}

			.gallery-item:hover .overlay-text-box {
				opacity: 1;
			}

			.overlay-text-box .project-title {
				font-family: 'Oswald', sans-serif;
				font-size: 1.1rem;
				letter-spacing: 1px;
				color: #111111;
				margin: 0 0 5px 0;
				text-transform: uppercase;
			}

			.overlay-text-box .project-desc {
				font-family: 'NanumHuman', sans-serif;
				font-size: 0.85rem;
				color: #555555;
				margin: 0;
			}

			/* 모바일 화면 대응 */
			@media screen and (max-width: 736px) {
				.page-container {
					padding: 20px 15px 50px 15px;
				}
				.page-title {
					font-size: 1.3rem;
					margin-bottom: 20px;
					padding-left: 10px;
				}
				.gallery-grid {
					grid-template-columns: repeat(1, 1fr);
					gap: 30px;
				}
				.gallery-item {
					max-width: 55%;
					margin: 0 auto;
					width: 100%;
				}
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="page-wrapper">
			
			<!-- Header -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="profile.html">Profile</a></li>
						<li><a href="Architecture.html">Architecture</a></li>
						<li class="current"><a href="Artwork.html">Artwork</a></li>
					</ul>
				</nav>
			</section>

			<!-- 아트워크 갤러리 영역 -->
			<div class="page-container">
				<h2 class="page-title">Artwork</h2>
				<div class="gallery-grid" id="gallery-container">
					<!-- 자바스크립트에 의해 카드가 자동으로 생성됩니다. -->
				</div>
			</div>

		</div>

		<!-- 🐢 오직 Artwork 페이지에서만 마우스를 따라다니는 거북이 스크립트 -->
		<div id="following-turtle" style="position: fixed; z-index: 999999; pointer-events: none; font-size: 26px; transition: transform 0.2s ease-out; display: none;">
			🐢
		</div>

		<script>
			// 📌 아트워크 작업물 목록 (인스타툰, 이모티콘 등 여기에 추가하세요!)
			const projects = [
				{ id: 2, title: "Instatoon Example", desc: "2024", img: "images/lego.png" },
				{ id: 1, title: "Emoticon Design", desc: "2024", img: "images/2-2 perspective.jpg" }
			];

			const container = document.getElementById('gallery-container');

			projects.forEach(project => {
				const item = document.createElement('a');
				item.href = `detail.html?id=${project.id}`;
				item.className = 'gallery-item';
				
				item.innerHTML = `
					<div class="gallery-img-box">
						<img src="${project.img}" alt="${project.title}" />
					</div>
					<div class="overlay-text-box">
						<h3 class="project-title">${project.title}</h3>
						<p class="project-desc">${project.desc}</p>
					</div>
				`;
				
				container.appendChild(item);
			});

			// 🐢 거북이 움직임 로직
			const turtle = document.getElementById('following-turtle');
			let mouseX = window.innerWidth / 2;
			let mouseY = window.innerHeight / 2;
			let turtleX = mouseX;
			let turtleY = mouseY;
			let isInside = false;

			// 아트워크 페이지 화면 안으로 마우스가 들어오면 거북이 등장
			window.addEventListener('mouseenter', () => {
				turtle.style.display = 'block';
				isInside = true;
			});

			// 마우스가 브라우저 바깥으로 나가면 숨김
			window.addEventListener('mouseleave', () => {
				turtle.style.display = 'none';
				isInside = false;
			});

			window.addEventListener('mousemove', (e) => {
				mouseX = e.clientX;
				mouseY = e.clientY;
			});

			function animateTurtle() {
				if (isInside) {
					let distX = mouseX - turtleX;
					let distY = mouseY - turtleY;
					
					turtleX += distX * 0.03; // 거북이의 느릿느릿한 속도
					turtleY += distY * 0.03;

					turtle.style.left = (turtleX + 20) + 'px';
					turtle.style.top = (turtleY + 20) + 'px';

					if (distX > 1) {
						turtle.style.transform = 'scaleX(1)';
					} else if (distX < -1) {
						turtle.style.transform = 'scaleX(-1)';
					}
				}
				requestAnimationFrame(animateTurtle);
			}

			animateTurtle();
		</script>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
