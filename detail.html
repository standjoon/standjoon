<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon - project detail</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			/* 🏛️ 헬베티카/모던 고딕 스타일 적용 */
			body { 
				font-family: 'Helvetica Neue', Helvetica, Arial, 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
				color: #222222;
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 메뉴 선택된 곳의 빨간색 배경 제거 및 깔끔한 텍스트화 */
			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;          
				box-shadow: none !important;        
			}
			
			#nav > ul > li > a {
				color: #555555 !important;
				background: transparent !important;
				font-weight: 400;
				letter-spacing: 1px;
			}

			/* 상세 페이지 본문 컨테이너 */
			.detail-container {
				max-width: 800px;
				margin: 0 auto;
				padding: 40px 20px 80px 20px;
				box-sizing: border-box;
			}

			/* 목록으로 돌아가기 버튼 */
			.back-link {
				display: inline-block;
				font-size: 0.85rem;
				letter-spacing: 1px;
				color: #888888;
				text-decoration: none;
				text-transform: uppercase;
				margin-bottom: 30px;
				transition: color 0.2s ease;
			}

			.back-link:hover {
				color: #111111;
			}

			/* 상세 페이지 타이틀 */
			.detail-title {
				font-size: 1.8rem;
				font-weight: 500;
				letter-spacing: 1.5px;
				color: #111111;
				text-transform: uppercase;
				margin-bottom: 8px;
			}

			.detail-subtitle {
				font-family: 'NanumHuman', sans-serif;
				font-size: 0.95rem;
				color: #777777;
				margin-bottom: 30px;
			}

			/* 메인 상세 이미지 박스 */
			.detail-img-box {
				width: 100%;
				margin-bottom: 40px;
				background-color: #f9f9f9;
			}

			.detail-img-box img {
				width: 100%;
				height: auto;
				display: block;
			}

			/* 텍스트 설명 구역 */
			.detail-content {
				font-family: 'NanumHuman', sans-serif;
				font-size: 0.95rem;
				color: #555555;
				line-height: 1.8;
			}

			.detail-content h3 {
				font-size: 1.05rem;
				font-weight: 500;
				letter-spacing: 1px;
				color: #111111;
				margin-top: 35px;
				margin-bottom: 12px;
				text-transform: uppercase;
			}

			/* 🗺️ 리얼 구글 맵 영역 및 흑백 모노크롬 필터 적용 */
			.detail-map-box {
				width: 100%;
				margin-top: 20px;
			}

			.detail-map-box iframe {
				width: 100% !important;
				height: 400px !important;
				border: none;
				/* 💡 구글 맵 원래의 컬러를 빼고 완벽한 흑백 모노크롬톤으로 바꿔주는 마법의 필터 */
				filter: grayscale(100%) contrast(120%);
			}

			/* 모바일 화면 대응 */
			@media screen and (max-width: 736px) {
				.detail-container {
					padding: 20px 15px 50px 15px;
				}
				.detail-title {
					font-size: 1.4rem;
				}
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="page-wrapper">
			
			<!-- Header -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="profile.html">About</a></li>
						<li class="current"><a href="Architecture.html">Architecture</a></li>
						<li><a href="Artwork.html">Artwork</a></li>
					</ul>
				</nav>
			</section>

			<!-- 상세 페이지 본문 영역 -->
			<div class="detail-container">
				<!-- 목록으로 돌아가기 -->
				<a href="Architecture.html" class="back-link">&larr; Back to Architecture</a>

				<!-- 작품 제목 및 부제 -->
				<h2 id="p-title" class="detail-title">Project Title</h2>
				<p id="p-subtitle" class="detail-subtitle">Project Subtitle & Concept</p>

				<!-- 상세 대표 이미지 -->
				<div class="detail-img-box">
					<img id="p-img" src="" alt="Project Detail Image" />
				</div>

				<!-- 상세 설명 텍스트 -->
				<div class="detail-content">
					<h3>Project Overview</h3>
					<p id="p-desc1">선택하신 프로젝트의 상세 기획 의도 및 대지 조건, 규모 등에 대한 기록이 들어가는 공간입니다.</p>
					
					<h3>Design Concept</h3>
					<p id="p-desc2">스케치업 모델링을 통한 공간감 스터디와 재료적 특성을 담아내는 상세 설명란입니다.</p>

					<!-- 🗺️ 실제 리얼 구글 맵이 들어갈 자리 -->
					<h3>Location Map</h3>
					<div class="detail-map-box">
						<iframe id="p-map" src="" allowfullscreen="" loading="lazy"></iframe>
					</div>
				</div>
			</div>

		</div>

		<!-- 자바스크립트: ID별 데이터 및 리얼 지도 자동 연동 시스템 -->
		<script>
			const urlParams = new URLSearchParams(window.location.search);
			const idNum = urlParams.get('id') || '1';

			// 📌 각 프로젝트별 정보와 '실제 위치(location)' 세팅 (여기에 원하시는 주소를 영어로 적어주세요!)
			const projectData = {
				"1": { 
					title: "thisconnect museum", 
					subtitle: "This connect Museum", 
					img: "images/2-2 perspective.jpg",
					desc1: "Daegu covered stream museum", 
					desc2: "Not dis just this",
					location: "VJ89+J6 Daegu" // 👈 첫 번째 프로젝트 주소
				},
				"2": { 
					title: "UAM Masterplan", 
					subtitle: "Urban Air Mobility Architecture", 
					img: "images/uam masterplan.jpg",
					desc1: "Daegu UAM-Urban masterplan.", 
					desc2: "how to draw new Axis City.",
					location: "VJ6H+V9 Daegu" // 👈 두 번째 프로젝트 주소
				},
				"3": { 
					title: "SONGPA New housing", 
					subtitle: "2023", 
					img: "images/songpa.jpg",
					desc1: "설명이 들어갈 자리입니다.", 
					desc2: "추가 상세 설명입니다.",
					location: "Ogeum-ro 40-gil, Songpa-gu, Seoul" // 👈 송파 프로젝트 주소
				},
				"4": { 
					title: "[0,0,-1]", 
					subtitle: "2024", 
					img: "images/under.jpg",
					desc1: "underbridge housing architecture competition.", 
					desc2: "New York Manhattan housing",
					location: "P245+XM, New York, NY" // 👈 뉴욕 프로젝트 주소
				},
				"5": { 
					title: "Joomak Igari", 
					subtitle: "2024", 
					img: "images/igari.jpg",
					desc1: "Igari rennovation project", 
					desc2: "추가 상세 설명입니다.",
					location: "59MP+F3 Pohang, Gyeongsangbuk-do" // 👈 이가리 프로젝트 주소
				},
				"6": { 
					title: "Oil rig renovation", 
					subtitle: "2025", 
					img: "images/oil sum.jpg",
					desc1: "설명이 들어갈 자리입니다.", 
					desc2: "추가 상세 설명입니다.",
					location: "G95M+H9 Ulsan" // 👈 오일릭 프로젝트 주소 예시
				}
			};

			if (projectData[idNum]) {
				document.getElementById('p-title').innerText = projectData[idNum].title;
				document.getElementById('p-subtitle').innerText = projectData[idNum].subtitle;
				document.getElementById('p-img').src = projectData[idNum].img;
				document.getElementById('p-desc1').innerText = projectData[idNum].desc1;
				document.getElementById('p-desc2').innerText = projectData[idNum].desc2;
				
				// 🗺️ 주소를 바탕으로 구글 맵 리얼 지도 임베드 링크 자동 생성
				const loc = projectData[idNum].location;
				const mapFrame = document.getElementById('p-map');
				mapFrame.src = `https://www.google.com/maps?q=${encodeURIComponent(loc)}&output=embed`;
			} else {
				document.getElementById('p-title').innerText = "PROJECT TITLE " + idNum;
				document.getElementById('p-subtitle').innerText = "Architecture & Space Archive";
			}
		</script>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
