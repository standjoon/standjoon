<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon - project detail</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			/* 🏛️ 헬베티카 및 모던 시스템 고딕 강제 적용 */
			body, h1, h2, h3, h4, h5, h6, p, a, span { 
				font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; 
				background-color: #ffffff !important; 
				color: #111111 !important;
				-webkit-font-smoothing: antialiased !important; 
				-moz-osx-font-smoothing: grayscale !important;
				text-rendering: optimizeLegibility !important;
			}

			body {
				background-color: #ffffff !important; 
			}

			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 메뉴 스타일 깔끔하게 정돈 */
			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;          
				box-shadow: none !important;        
			}
			
			#nav > ul > li > a {
				color: #555555 !important;
				background: transparent !important;
				font-weight: 400 !important;
				letter-spacing: -0.3px !important;
			}

			/* 상세 페이지 본문 컨테이너 */
			.detail-container {
				max-width: 800px;
				margin: 0 auto;
				padding: 40px 20px 80px 20px;
				box-sizing: border-box;
			}

			/* 목록으로 돌아가기 버튼 */
			.back-link {
				display: inline-block;
				font-size: 0.85rem;
				letter-spacing: -0.2px;
				color: #888888;
				text-decoration: none;
				text-transform: uppercase;
				margin-bottom: 30px;
				transition: color 0.2s ease;
			}

			.back-link:hover {
				color: #111111;
			}

			/* 상세 페이지 메인 타이틀 */
			.detail-title {
				font-size: 1.8rem !important;
				font-weight: 700 !important;
				letter-spacing: -0.8px !important; 
				color: #111111 !important;
				text-transform: uppercase;
				margin-bottom: 6px;
			}

			.detail-subtitle {
				font-size: 0.95rem !important;
				font-weight: 400 !important;
				color: #777777 !important;
				margin-bottom: 30px;
				letter-spacing: -0.3px !important;
			}

			/* 메인 상세 이미지 박스 */
			.detail-img-box {
				width: 100%;
				margin-bottom: 40px;
				background-color: #f9f9f9;
			}

			.detail-img-box img {
				width: 100%;
				height: auto;
				display: block;
			}

			/* 텍스트 설명 구역 */
			.detail-content {
				font-size: 0.95rem !important;
				color: #555555 !important;
				line-height: 1.8;
				letter-spacing: -0.2px !important;
			}

			.detail-content h3 {
				font-size: 1rem !important;
				font-weight: 600 !important;
				letter-spacing: -0.3px !important;
				color: #111111 !important;
				margin-top: 35px;
				margin-bottom: 10px;
				text-transform: uppercase;
			}

			/* 🗺️ 오픈하우스 서울 스타일의 무광 흑백 맵 영역 */
			.detail-map-box {
				width: 100%;
				height: 450px; /* 지도 높이 지정 */
				margin-top: 20px;
				position: relative;
				border: 1px solid #eaeaea; 
			}

			.detail-map-box iframe {
				width: 100% !important;
				height: 100% !important;
				border: none;
				/* 💡 구글 맵 컬러를 완전히 빼고 무광 그레이 흑백톤으로 변환하는 필터 */
				filter: grayscale(100%) brightness(103%) contrast(95%);
			}

			/* 모바일 화면 대응 */
			@media screen and (max-width: 736px) {
				.detail-container {
					padding: 20px 15px 50px 15px;
				}
				.detail-title {
					font-size: 1.3rem !important;
				}
				.detail-map-box {
					height: 300px;
				}
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="page-wrapper">
			
			<!-- Header -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="profile.html">About</a></li>
						<li class="current"><a href="Architecture.html">Architecture</a></li>
						<li><a href="Artwork.html">Artwork</a></li>
					</ul>
				</nav>
			</section>

			<!-- 상세 페이지 본문 영역 -->
			<div class="detail-container">
				<!-- 목록으로 돌아가기 -->
				<a href="Architecture.html" class="back-link">&larr; Back to Architecture</a>

				<!-- 작품 제목 및 부제 -->
				<h2 id="p-title" class="detail-title">Project Title</h2>
				<p id="p-subtitle" class="detail-subtitle">Project Subtitle & Concept</p>

				<!-- 상세 대표 이미지 -->
				<div class="detail-img-box">
					<img id="p-img" src="" alt="Project Detail Image" />
				</div>

				<!-- 상세 설명 텍스트 -->
				<div class="detail-content">
					<h3>Project Overview</h3>
					<p id="p-desc1">선택하신 프로젝트의 상세 기획 의도 및 대지 조건, 규모 등에 대한 기록이 들어가는 공간입니다.</p>
					
					<h3>Design Concept</h3>
					<p id="p-desc2">스케치업 모델링을 통한 공간감 스터디와 재료적 특성을 담아내는 상세 설명란입니다.</p>

					<!-- 🗺️ 오픈하우스 서울풍 무광 그레이 스케일 맵 -->
					<h3>Location Map</h3>
					<div class="detail-map-box">
						<iframe id="p-map" src="" allowfullscreen="" loading="lazy"></iframe>
					</div>
				</div>
			</div>

		</div>

		<!-- 자바스크립트: ID별 데이터 및 무광 흑백 지도 연동 시스템 -->
		<script>
			const urlParams = new URLSearchParams(window.location.search);
			const idNum = urlParams.get('id') || '1';

			// 📌 각 프로젝트별 정보와 '실제 위치(location)' 세팅 (여기에 원하시는 주소를 영어로 적어주세요!)
			const projectData = {
				"1": { 
					title: "thisconnect museum", 
					subtitle: "This connect Museum", 
					img: "images/2-2 perspective.jpg",
					desc1: "Daegu covered stream museum", 
					desc2: "Not dis just this",
					location: "VJ89+J6 Daegu" // 👈 첫 번째 프로젝트 주소
				},
				"2": { 
					title: "UAM Masterplan", 
					subtitle: "Urban Air Mobility Architecture", 
					img: "images/uam masterplan.jpg",
					desc1: "Daegu UAM-Urban masterplan.", 
					desc2: "how to draw new Axis City.",
					location: "VJ6H+V9 Daegu" // 👈 두 번째 프로젝트 주소
				},
				"3": { 
					title: "SONGPA New housing", 
					subtitle: "2023", 
					img: "images/songpa.jpg",
					desc1: "설명이 들어갈 자리입니다.", 
					desc2: "추가 상세 설명입니다.",
					location: "Ogeum-ro 40-gil, Songpa-gu, Seoul" // 👈 송파 프로젝트 주소
				},
				"4": { 
					title: "[0,0,-1]", 
					subtitle: "2024", 
					img: "images/under.jpg",
					desc1: "underbridge housing architecture competition.", 
					desc2: "New York Manhattan housing",
					location: "P245+XM, New York, NY" // 👈 뉴욕 프로젝트 주소
				},
				"5": { 
					title: "Joomak Igari", 
					subtitle: "2024", 
					img: "images/igari.jpg",
					desc1: "Igari rennovation project", 
					desc2: "추가 상세 설명입니다.",
					location: "59MP+F3 Pohang, Gyeongsangbuk-do" // 👈 이가리 프로젝트 주소
				},
				"6": { 
					title: "Oil rig renovation", 
					subtitle: "2025", 
					img: "images/oil sum.jpg",
					desc1: "설명이 들어갈 자리입니다.", 
					desc2: "추가 상세 설명입니다.",
					location: "G95M+H9 Ulsan" // 👈 오일릭 프로젝트 주소 예시
				}
			};

			if (projectData[idNum]) {
				document.getElementById('p-title').innerText = projectData[idNum].title;
				document.getElementById('p-subtitle').innerText = projectData[idNum].subtitle;
				document.getElementById('p-img').src = projectData[idNum].img;
				document.getElementById('p-desc1').innerText = projectData[idNum].desc1;
				document.getElementById('p-desc2').innerText = projectData[idNum].desc2;
				
				// 🗺️ CARTO 맵 임베드 링크 생성 (스타일링 포함)
				// z=16은 줌 레벨, &layer=background&layer=labels를 통해 기본 배경과 라벨만 출력
				const loc = projectData[idNum].location;
				const mapFrame = document.getElementById('p-map');
				mapFrame.src = `https://carto.com/location-data-services/basemaps/api/v1/map/light_all/16/${encodeURIComponent(loc)}.png?api_key=your_carto_api_key&output=embed`;
				
				// 💡 아까 말씀드린 오픈하우스서울 같은 시크한 흑백 다이어그램 맵을 원하신다면, 
				// 위 줄 대신 아래 줄로 교체해서 사용하시면 됩니다. (CSS 필터와 조합하여 완벽한 흑백톤이 됩니다.)
				// mapFrame.src = `https://carto.com/location-data-services/basemaps/api/v1/map/light_all/16/${encodeURIComponent(loc)}.png?api_key=your_carto_api_key&output=embed`;
				
				// 📌 만약 위의 CARTO 맵 주소가 잘 안 먹히거나 에러가 난다면, 아래의 '구글 맵 우회 크롭 방식'을 사용하시면 됩니다. 
				// 아까 거슬렸던 정보창(말풍선)을 완전히 위로 숨기고 흑백 필터를 먹인 버전입니다.
				// const loc = projectData[idNum].location;
				// const mapFrame = document.getElementById('p-map');
				// mapFrame.src = `https://www.google.com/maps?q=${encodeURIComponent(loc)}&z=16&output=embed`;
			} else {
				document.getElementById('p-title').innerText = "PROJECT TITLE " + idNum;
				document.getElementById('p-subtitle').innerText = "Architecture & Space Archive";
			}
		</script>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
