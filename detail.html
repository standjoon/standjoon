<!DOCTYPE HTML>
<html>
	<head>
		<title>standjoon - project detail</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
		<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHuman.css" rel="stylesheet">
		<style>
			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important; 
				background-color: #ffffff !important; 
			}
			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 메뉴 선택된 곳의 빨간색 배경 제거 및 깔끔한 텍스트화 */
			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;          
				box-shadow: none !important;        
			}
			
			#nav > ul > li > a {
				color: #555555 !important;
				background: transparent !important;
			}

			/* 상세 페이지 본문 컨테이너 */
			.detail-container {
				max-width: 800px;
				margin: 0 auto;
				padding: 40px 20px 80px 20px;
				box-sizing: border-box;
			}

			/* 목록으로 돌아가기 버튼 */
			.back-link {
				display: inline-block;
				font-family: 'Oswald', sans-serif;
				font-size: 0.9rem;
				letter-spacing: 1px;
				color: #888888;
				text-decoration: none;
				text-transform: uppercase;
				margin-bottom: 30px;
				transition: color 0.2s ease;
			}

			.back-link:hover {
				color: #111111;
			}

			/* 상세 페이지 타이틀 */
			.detail-title {
				font-family: 'Oswald', sans-serif;
				font-size: 2rem;
				letter-spacing: 2px;
				color: #111111;
				text-transform: uppercase;
				margin-bottom: 10px;
			}

			.detail-subtitle {
				font-family: 'NanumHuman', sans-serif;
				font-size: 1rem;
				color: #777777;
				margin-bottom: 30px;
			}

			/* 메인 상세 이미지 박스 */
			.detail-img-box {
				width: 100%;
				margin-bottom: 40px;
				background-color: #f0f0f0;
			}

			.detail-img-box img {
				width: 100%;
				height: auto;
				display: block;
			}

			/* 텍스트 설명 구역 */
			.detail-content {
				font-family: 'NanumHuman', sans-serif;
				font-size: 1rem;
				color: #555555;
				line-height: 1.8;
			}

			.detail-content h3 {
				font-family: 'Oswald', sans-serif;
				font-size: 1.2rem;
				letter-spacing: 1px;
				color: #111111;
				margin-top: 30px;
				margin-bottom: 15px;
				text-transform: uppercase;
			}

			/* 모바일 화면 대응 */
			@media screen and (max-width: 736px) {
				.detail-container {
					padding: 20px 15px 50px 15px;
				}
				.detail-title {
					font-size: 1.5rem;
				}
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="page-wrapper">
			
			<!-- Header -->
			<section id="header">
				<nav id="nav">
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="profile.html">Profile</a></li>
						<li class="current"><a href="Architecture.html">Architecture</a></li>
						<li><a href="Artwork.html">Artwork</a></li>
					</ul>
				</nav>
			</section>

			<!-- 상세 페이지 본문 영역 -->
			<div class="detail-container">
				<!-- 목록으로 돌아가기 -->
				<a href="Architecture.html" class="back-link">&larr; Back to Architecture</a>

				<!-- 작품 제목 및 부제 -->
				<h2 id="p-title" class="detail-title">Project Title</h2>
				<p id="p-subtitle" class="detail-subtitle">Project Subtitle & Concept</p>

				<!-- 상세 대표 이미지 (자바스크립트에 의해 ID별로 자동 변경됨) -->
				<div class="detail-img-box">
					<img id="p-img" src="" alt="Project Detail Image" />
				</div>

				<!-- 상세 설명 텍스트 -->
				<div class="detail-content">
					<h3>Project Overview</h3>
					<p id="p-desc1">선택하신 프로젝트의 상세 기획 의도 및 대지 조건, 규모 등에 대한 기록이 들어가는 공간입니다.</p>
					
					<h3>Design Concept</h3>
					<p id="p-desc2">스케치업 모델링을 통한 공간감 스터디와 재료적 특성을 담아내는 상세 설명란입니다.</p>
				</div>
			</div>

		</div>

		<!-- 자바스크립트: ID별 데이터 및 이미지 자동 매칭 시스템 -->
		<script>
			const urlParams = new URLSearchParams(window.location.search);
			const idNum = urlParams.get('id') || '1';

			// 📌 각 프로젝트별 이미지와 텍스트 데이터 세팅
			const projectData = {
				"1": { 
					title: "thisconnect museum", 
					subtitle: "This connect Museum", 
					img: "images/2-2 perspective.jpg",
					desc1: "404 not found", 
					desc2: "404 not found" 
				},
				"2": { 
					title: "UAM Masterplan", 
					subtitle: "Urban Air Mobility Architecture", 
					img: "images/uam masterplan.jpg", // 👈 UAM 마스터플랜 이미지 정확히 연동
					desc1: "도심항공교통(UAM) 인프라를 위한 복합 환승 센터 및 마스터플랜 디자인입니다.", 
					desc2: "미래 교통 체계와 도시 공간의 결합을 스케치업 모델링으로 구체화하였습니다." 
				},
				"3": { 
					title: "nontitle", 
					subtitle: "2023", 
					img: "images/lego.png",
					desc1: "설명이 들어갈 자리입니다.", 
					desc2: "추가 상세 설명입니다." 
				}
			};

			if (projectData[idNum]) {
				document.getElementById('p-title').innerText = projectData[idNum].title;
				document.getElementById('p-subtitle').innerText = projectData[idNum].subtitle;
				document.getElementById('p-img').src = projectData[idNum].img; // 이미지 자동 교체
				document.getElementById('p-desc1').innerText = projectData[idNum].desc1;
				document.getElementById('p-desc2').innerText = projectData[idNum].desc2;
			} else {
				document.getElementById('p-title').innerText = "PROJECT TITLE " + idNum;
				document.getElementById('p-subtitle').innerText = "Architecture & Space Archive";
			}
		</script>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
