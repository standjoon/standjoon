			body { 
				font-family: 'Oswald', 'NanumHuman', sans-serif !important;

			#page-wrapper { 
				background-color: #ffffff !important; 
			}
			
			/* 상단 여백 조정 */
			#header {
				padding-top: 3em !important;
				padding-bottom: 2em !important;
			}
			
			/* 푸터/기타 영역 숨김 */
			#footer, .wrapper { 
				display: none !important; 
			}

			/* 메뉴 선택된 곳의 빨간색 배경 제거 및 깔끔한 텍스트화 */
			#nav > ul > li.current > a, 
			#nav > ul > li:hover > a {
				background: transparent !important; 
				color: #111111 !important;          
				box-shadow: none !important;

			.profile-title {
				font-family: 'Oswald', sans-serif;
				font-size: 1.8rem;
				letter-spacing: 2px;
				color: #111111;
				text-transform: uppercase;
				margin-bottom: 30px;
				text-align: left;
			}

			/* 프로필 본문 텍스트 스타일 */
			.profile-content {
				font-family: 'NanumHuman', sans-serif;
				font-size: 1rem;
				color: #555555;
				line-height: 1.8;
			}

			/* 📱 모바일 화면 대응 */
			@media screen and (max-width: 736px) {
				.profile-container {
					padding: 30px 20px;
				}
				.profile-title {
					font-size: 1.4rem;
				}
				.profile-content {
					font-size: 0.9rem;

			}
